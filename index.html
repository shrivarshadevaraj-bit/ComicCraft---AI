<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft</title>
</head>
<body>
    <h1>ComicCraft 🎭</h1>

    <form action="/create" method="post">
        <label>Character:</label><br>
        <input type="text" name="character" required><br><br>

        <label>Story:</label><br>
        <textarea name="story" required></textarea><br><br>

        <button type="submit">Create Comic</button>
    </form>

    {% if result %}
        <h2>Result:</h2>
        <p>{{ result }}</p>
    {% endif %}
</body>
</html>
